[build-system]
requires = ["setuptools>=58", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "podvault"
version = "0.2.0"
description = "Save and restore ephemeral GPU-pod projects with Kopia or AzCopy"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Podvault contributors"}]
keywords = ["backup", "kopia", "azcopy", "azure", "runpod", "machine-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Archiving :: Backup",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/konpuringu/podvault"
Repository = "https://github.com/konpuringu/podvault"
Issues = "https://github.com/konpuringu/podvault/issues"

[project.scripts]
podvault = "podvault.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
